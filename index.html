<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syed Shayan Ahmed — Projects</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B1620'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23E2984B' stroke-width='6'/%3E%3Cline x1='50' y1='10' x2='50' y2='30' stroke='%23E2984B' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle filters" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <line x1="20" y1="2" x2="20" y2="9" stroke="currentColor" stroke-width="2.5"/>
          <line x1="20" y1="31" x2="20" y2="38" stroke="currentColor" stroke-width="2.5"/>
          <line x1="2" y1="20" x2="9" y2="20" stroke="currentColor" stroke-width="2.5"/>
          <line x1="31" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </div>
      <h1 class="brand-name">Syed Shayan<br>Ahmed</h1>
      <p class="brand-tag">Engineering Projects — Field Notes</p>
    </div>

    <div class="panel-block">
      <label class="field-label" for="search">Search</label>
      <input id="search" type="text" placeholder="e.g. robot, sensor, firmware" autocomplete="off">
    </div>

    <div class="panel-block">
      <span class="field-label">Filter — Tag</span>
      <div id="tagFilters" class="chip-row" role="group" aria-label="Filter by tag"></div>
    </div>

    <div class="panel-block">
      <span class="field-label">Filter — Status</span>
      <div id="statusFilters" class="chip-row" role="group" aria-label="Filter by status"></div>
    </div>

    <button class="clear-btn" id="clearFilters" type="button">Clear filters</button>

    <div class="sidebar-footer">
      <div class="rule"></div>
      <p class="footnote">Static build. No server required.</p>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main" id="main" tabindex="-1"></main>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
